name: Qitaa one-time source formatting
on:
  push:
    branches: [feat/qitaa-phase1-seller-admin-review]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    if: github.repository == 'overurdream-collab/arab-magic-decoder'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Apply configured ESLint autofix
        run: bunx eslint src --fix
      - name: Store formatting fixes only in review branch
        run: |
          git add -u src/
          if ! git diff --cached --quiet; then
            git config user.name 'Qitaa Format Bot'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style: apply consistent lint formatting after security review'
            git push origin HEAD:feat/qitaa-phase1-seller-admin-review
          fi
