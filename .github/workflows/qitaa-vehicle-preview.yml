name: Qitaa Vehicle Reference Preview
on:
  push:
    branches: [feat/qitaa-vehicle-reference-staging]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  offline-import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Verify offline vehicle staging and negative cases
        run: bun test tests/vehicle-reference.test.ts
