name: Qitaa VIN One-Time Formatter
on:
  push:
    branches: [feat/qitaa-vin-official-decode]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write src/lib/nhtsa-vin.ts src/components/VehiclePicker.tsx tests/nhtsa-vin.test.ts
      - name: Commit formatting to feature branch
        run: |
          git add src/lib/nhtsa-vin.ts src/components/VehiclePicker.tsx tests/nhtsa-vin.test.ts
          if ! git diff --cached --quiet; then
            git config user.name 'Qitaa CI'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style: format official VIN decoder integration'
            git push origin HEAD:feat/qitaa-vin-official-decode
          fi
