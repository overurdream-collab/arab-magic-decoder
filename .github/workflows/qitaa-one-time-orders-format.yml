name: Temporary Orders Formatter
on:
  push:
    branches: [feat/qitaa-purchase-request-lifecycle]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: true }
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx eslint src --fix
      - name: Commit style changes only on review branch
        run: |
          git add -u src/
          if ! git diff --cached --quiet; then
            git config user.name 'Qitaa Formatter'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style: normalize purchase request UI formatting'
            git push origin HEAD:feat/qitaa-purchase-request-lifecycle
          fi
