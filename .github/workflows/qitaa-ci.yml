name: Qitaa CI

on:
  push:
    branches:
      - feat/qitaa-phase1-seller-admin-review
      - feat/qitaa-zero-result-analytics
      - feat/qitaa-zero-result-analytics-rebased
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript typecheck
        run: bunx tsc --noEmit
      - name: ESLint
        run: bun run lint
      - name: Production build
        run: bun run build
