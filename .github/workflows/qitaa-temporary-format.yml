name: Format Catalog Source Once
on:
  push:
    branches: [feat/qitaa-catalog-import-staging]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: true }
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx eslint src --fix
      - name: Save source formatting on review branch
        run: |
          git add -u src/
          if ! git diff --cached --quiet; then
            git config user.name 'Qitaa CI Formatter'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style: format CSV import source'
            git push origin HEAD:feat/qitaa-catalog-import-staging
          fi
